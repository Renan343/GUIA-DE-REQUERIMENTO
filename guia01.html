<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Requerimento</title>
</head>
<body>
<h1>INSTITUTO FEDERAL</h1>
<h2>Ceará</h2>
<h2>Campus Cedro</h2>
<main>
<form action="">
<!-- <label for="protocolo">Protocolo N°</label> 
<input type="number" id="protocolo" name="protocolo"> -->

<fieldset>
    <legend><label for="protocolo">Protocolo N°</label> <input type="number" name="protocolo" id="protocolo"></legend>
<label for="requerente">REQUERENTE</label>
<input type="text" name="requerente" id="requerente" required>

<label for="matricula">N° DE MATRICULA</label>
<input type="number" name="matricula" id="matricula" required>
<fieldset>
    <legend>PREENCHER ⬇</legend>
    <label for="data-nascimento">DATA DE NASCIMENTO</label>
    <input type="date" name="data-nascimento" id="data-nascimento" required>
    <br>
    <label for="filiacao">FILIAÇÃO</label>
    <input type="text" name="filiacao" id="filiacao" required>
    <br>
    <label for="naturalidade">NATURALIDADE</label>
    <select name="naturalidade" id="naturalidade" required>
        <option value="BR">Brasileiro</option>
        <option value="USA">Estaudunidense</option>
        <option value="UK">Inglês</option>
        <option value="JP">Japão</option>
    </select>
</fieldset>
<br>
<label for="curso">CURSO</label>
<select name="curso" id="curso" required>
    <option value="Mecatronica-Industrial">Mecatronica Industrial</option>
    <option value="Sistemas-de-Informacao">Sistemas de Informação</option>
    <option value="Licenciatura-Matematica">Licenciatura em Matemática</option>
    <option value="Engenharia-Eletrica">Engenharia Eletrica</option>
</select>
<label for="periodo">PERIODO</label>
<input type="text" name="periodo" id="periodo" required>

<label for="turno">TURNO</label>
<select name="turno" id="turno" required>
    <option value="manha">Manhã</option>
    <option value="tarde">Tarde</option>
    <option value="noite">Noite</option>
</select>
<label for="telefone">TELEFONE</label>
<input type="tel" name="telefone" id="telefone" required>

<label for="email">E-MAIL</label>
<input type="email" name="email" id="email" required>
</fieldset>
<strong>ASSINALE:</strong>
<fieldset>
    <input type="checkbox" name="2via" id="2via" >
    <label for="2via">01 | 2° Via (especificar) | CCA</label>
    <br>
    <input type="checkbox" name="aproveitamento-disciplina" id="aproveitamento-disciplina" >
    <label for="aproveitamento-disciplina">02 | Aproveitamento de disciplina (anexar Histórico Escolar e Programa da Disciplina) | Cordenação do Curso</label>
    <br>
    <input type="checkbox" name="justificativa-matricula" id="justificativa-matricula" >
    <label for="justificativa-matricula">03 | Matricula fora do prazo (justificar) | CCA</label>
    <br>
    <input type="checkbox" name="cancelamento-matricula" id="cancelamento-matricula" >
    <label for="cancelamento-matricula">04 | Cancelamento da Matricula | CCA</label>
    <br>
    <input type="checkbox" name="colar-grau" id="colar-grau" >
    <label for="colar-grau">05 | Colação de Grau/Colação especial (justificar) | CCA</label>
    <br>
    <input type="checkbox" name="declaracao" id="declaracao" >
    <label for="declaracao">06 | Declaração (Especificar) | CCA</label>
    <br>
    <input type="checkbox" name="diploma" id="diploma" >
    <label for="diploma">07 | Diploma (especificar) | CCA</label>
    <br>
    <input type="checkbox" name="historico-escolar" id="historico-escolar" >
    <label for="historico-escolar">08 | Histórico Escolar | CCA</label>
    <br>
    <input type="checkbox" name="reabertura-matricula" id="reabertura-matricula" >
    <label for="reabertura-matricula">09 | Reabertura de Matrícula | CCA</label>
    <br>
    <input type="checkbox" name="segunda-chamada" id="segunda-chamada" >
    <label for="segunda-chamada">10 | Segunda Chamada (anexar justificativa) | Cordenação do Curso</label>
    <br>
    <input type="checkbox" name="reingresso" id="reingresso" >
    <label for="reingresso">11 | Reingresso | CCA</label>
    <br>
    <input type="checkbox" name="trancamento-disciplina" id="trancamento-disciplina" >
    <label for="trancamento-disciplina">12 | Trancamento de Disciplina (especificar) | Cordenação do Curso</label>
    <br>
    <input type="checkbox" name="trancamento-matricula" id="trancamento-matricula" >
    <label for="trancamento-matricula">13 | Trancamento de Matrícula (anexar documentação comprobatória) | Cordenação Pedagógica</label>
    <br>
    <input type="checkbox" name="transferencia" id="transferencia" >
    <label for="transferencia">14 | Transferencia para outra instituição | CCA</label>
    <br>
    <input type="checkbox" name="validacao-conhecimento" id="validacao-conhecimento" >
    <label for="validacao-conhecimento">15 | Validação de conhecimento (especificar) | Coordenação do Curso</label>
    <br>
    <input type="checkbox" name="reajuste" id="reajuste" >
    <label for="reajuste">16 | Reajuste | CCA</label>
    <br>
    <input type="checkbox" name="recorrecao-prova" id="recorrecao-prova" >
    <label for="recorrecao-prova">17 | Recorreção de prova | Coordenação do Curso</label>
    <br>
    <input type="checkbox" name="auxilio-transporte" id="auxilio-transporte" >
    <label for="auxilio-transporte">18 | Auxilio transporte | Serviço social</label>
    <br>
    <input type="checkbox" name="auxilio-moradia" id="auxilio-moradia" >
    <label for="auxilio-moradia">19 | Auxilio Moradia | Serviço social</label>
    <br>
    <input type="checkbox" name="auxilio-oculos" id="auxilio-oculos" >
    <label for="auxilio-oculos">20 | Auxilio Oculos | Serviço social</label>
    <br>
    <input type="checkbox" name="auxilio-pais-maes" id="auxilio-pais-maes" >
    <label for="auxilio-pais-maes">21 | Auxilio pais e maes | Serviço social</label>
    <br>
    <input type="checkbox" name="outros" id="outros" >
    <label for="outros">22 | Outros (especificar)</label>
    <br>


    <label for="outros-texto">Especificar</label>
    <textarea name="outros-texto" id="outros-texto"></textarea>
    <br>
    <label for="outros-justificacao">Justificar</label>
    <textarea name="outros-justificacao" id="outros-justificacao"></textarea>
    <br>
</fieldset>
<fieldset>
    <input type="checkbox" name="declaracao-requerente" id="declaracao-requerente">
    <label for="declaracao-requerente">DECLARO CONHECER O REGIMENTO DESTA IFE, BEM COMO O PRAZO NECESSÁRIO À TRAMITAÇÃO DO PROCESSO</label>
    <br>
    <input type="checkbox" name="declaracao-funcionario" id="declaracao-funcionario">
    <label for="declaracao-funcionario">PERMISSÃO  DO FUNCIONÁRIO</label> <!-- Sei que isso não faz sentido, coloquei só por colocar -->
    <br>
    <label for="data-assinatura">CEDRO - CE </label> <input type="date" id="data-assinatura">
</fieldset>
<fieldset>
    <legend>VISTO (COORDENAÇÃO DE ASSUNTOS ESTUDANTIS)</legend>
    <input type="checkbox" name="chave-armario" id="chave-armario">
    <label for="chave-armario-negativo">O requerente não deve chave de armario</label>
    <br>
    <label for="chave-armario-positivo">O requerente deve chave de armario</label>
    <textarea name="chave-armario-positivo" id="chave-armario-positivo"></textarea>
    <br>
    <input type="checkbox" name="assinatura-chave-armario" id="assinatura-chave-armario">
    <label for="assinatura-chave-armario">Declaro-me responsavel pelo que foi proferido no campo de texto acima</label>
</fieldset>
<fieldset>
    <legend>VISTO (BIBLIOTECA)</legend>
    <input type="checkbox" name="nao-deve-livros" id="nao-deve-livros">
    <label for="nao-deve-livros">O requerente não deve livros na biblioteca</label>
    <br>
    <label for="deve-livros">O requerente deve livros na biblioteca</label>
    <textarea name="deve-livros" id="deve-livros"></textarea>
    <br>
    <input type="checkbox" name="assinatura-biblioteca" id="assinatura-biblioteca">
    <label for="assinatura-biblioteca">Declaro-me responsavel pelo que foi proferido no campo de texto acima</label>
</fieldset>
</form>
</main>
</body>
</html>
